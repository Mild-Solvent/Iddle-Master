<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frozen by Idle Master Tabs</title>
    <link rel="stylesheet" href="frozen.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <img src="icons/icon-128.png" alt="" class="mark">
        <p class="eyebrow">Idle Master Tabs</p>
        <h1>This tab is frozen</h1>
        <p id="summary" class="summary">The original page has been unloaded to free memory.</p>
        <button id="restoreButton" type="button">Restore tab</button>
        <p class="note">Restoring reloads the page from its original URL. Unsaved in-page state may be gone.</p>
      </section>
    </main>
    <script src="frozen.js"></script>
  </body>
</html>
